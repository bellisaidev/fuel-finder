name: CI

on:
  pull_request:
    branches:
      - master

  push:
    branches:
      - master

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Java 21
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}

      - name: Ensure Gradle wrapper is executable
        run: chmod +x gradlew

      - name: Run tests
        run: ./gradlew test

      - name: Verify code coverage
        run: ./gradlew jacocoTestCoverageVerification

      - name: Build Spring Boot JAR
        run: ./gradlew bootJar

  container-build-and-scan:
    name: Build and Scan Container Image
    needs: build-and-test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write

    defaults:
      run:
        working-directory: backend

    env:
      IMAGE_REF: fuel-finder:ci-${{ github.sha }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Build Docker image
        run: docker build --pull --tag "$IMAGE_REF" .

      - name: Scan image for High and Critical vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_REF }}
          format: table
          exit-code: '0'
          severity: HIGH,CRITICAL
          scanners: vuln
          vuln-type: os,library
          version: v0.70.0

      - name: Generate High and Critical vulnerability SARIF
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE_REF }}
          format: sarif
          output: trivy-results.sarif
          exit-code: '0'
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          scanners: vuln
          vuln-type: os,library
          skip-setup-trivy: true

      - name: Upload Trivy results to GitHub code scanning
        if: ${{ always() && hashFiles('trivy-results.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-container
