fuelfinder:
  api:
    base-url: https://www.fuel-finder.service.gov.uk/api/v1
  ingestion:
    scheduler:
      enabled: true
      cron: "0 */30 * * * *"
      retailer-name: "FUEL_FINDER_API"

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false